<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equus — Realistic 3D Horse in Three.js</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%235b220c'/%3E%3Cpath d='M11 23c1-6 4-11 9-13l2 3-3 3c-1 2 0 4 1 7z' fill='%23f4f1eb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="hud-header">
    <h1>Equus — Realistic 3D Horse</h1>
    <p class="hud-subtitle">16-hand Warmblood anatomy · 39-bone skeletal rig · Procedural PBR</p>
  </header>

  <main id="viewport">
    <canvas id="horse-canvas" aria-label="Interactive 3D Horse Viewport"></canvas>
  </main>

  <aside id="control-panel" class="control-panel" aria-label="Horse Controls">
    <div class="panel-top">
      <span class="panel-title">Studio Controls</span>
      <button id="btn-toggle-panel" class="ghost-btn" type="button" aria-expanded="true">Hide</button>
    </div>

    <div class="panel-body">
      <section class="control-group">
        <h2>Gait &amp; Posture</h2>
        <div class="btn-grid cols-3">
          <button type="button" data-gait="idle" class="active" aria-pressed="true">Idle</button>
          <button type="button" data-gait="walk" aria-pressed="false">Walk</button>
          <button type="button" data-gait="trot" aria-pressed="false">Trot</button>
          <button type="button" data-gait="gallop" aria-pressed="false">Gallop</button>
          <button type="button" data-gait="stance" aria-pressed="false">Stance</button>
          <button type="button" id="btn-pause" aria-pressed="false">Pause</button>
        </div>
      </section>

      <section class="control-group">
        <h2>Coat</h2>
        <div class="btn-grid">
          <button type="button" class="coat-btn active" data-coat="bay" aria-pressed="true">
            <span class="swatch" style="background:#7a2e14"></span>Blood Bay
          </button>
          <button type="button" class="coat-btn" data-coat="dappleGray" aria-pressed="false">
            <span class="swatch" style="background:#b7bcc4"></span>Dapple Gray
          </button>
          <button type="button" class="coat-btn" data-coat="black" aria-pressed="false">
            <span class="swatch" style="background:#1c1c20"></span>Friesian
          </button>
          <button type="button" class="coat-btn" data-coat="palomino" aria-pressed="false">
            <span class="swatch" style="background:#d4963a"></span>Palomino
          </button>
          <button type="button" class="coat-btn" data-coat="chestnut" aria-pressed="false">
            <span class="swatch" style="background:#9a3d18"></span>Chestnut
          </button>
        </div>
      </section>

      <section class="control-group">
        <h2>Camera View</h2>
        <div class="btn-grid cols-3">
          <button type="button" data-camera="hero" class="active" aria-pressed="true">3/4 Hero</button>
          <button type="button" data-camera="side" aria-pressed="false">Side</button>
          <button type="button" data-camera="head" aria-pressed="false">Head</button>
          <button type="button" data-camera="front" aria-pressed="false">Front</button>
          <button type="button" data-camera="rear" aria-pressed="false">Rear</button>
          <button type="button" data-camera="top" aria-pressed="false">Top</button>
        </div>
      </section>

      <section class="control-group">
        <h2>Lighting</h2>
        <div class="btn-grid cols-3">
          <button type="button" data-lighting="goldenHour" class="active" aria-pressed="true">Golden</button>
          <button type="button" data-lighting="studio" aria-pressed="false">Studio</button>
          <button type="button" data-lighting="overcast" aria-pressed="false">Meadow</button>
        </div>
      </section>

      <section class="control-group">
        <h2>Animation Speed</h2>
        <div class="speed-row">
          <input id="speed-slider" type="range" min="0.2" max="1.8" step="0.05" value="1.0" aria-label="Animation speed">
          <span id="speed-value" class="speed-val">1.00×</span>
        </div>
      </section>

      <div class="panel-footer">
        <span id="mesh-stats">Loading…</span>
        <span>Keys: 1–5 · Space · R</span>
      </div>
    </div>
  </aside>

  <p class="hud-hint">Drag to orbit · Scroll to zoom · Right-drag to pan</p>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
